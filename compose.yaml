x-app-common: &app-common
  build:
    context: .
    dockerfile: app/Dockerfile
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://hybriduser:${POSTGRES_PASSWORD}@db:5432/hybridmod
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hybridmod
      POSTGRES_USER: hybriduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create the .env file first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybriduser -d hybridmod"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app-common

  app2:
    <<: *app-common

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  postgres_data:
